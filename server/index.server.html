  <!-- Apply the saved theme BEFORE first paint. ThemeService only adds .dark-theme once
       Angular boots, so without this the :root (light) palette - a cyan --bg-primary
       gradient - flashed on every load, most visibly on mobile. Dark is the default. -->
  <script>
    (function () {
      var dark = true;
      try { dark = localStorage.getItem('zs-theme') !== 'light'; } catch (e) {}
      var c = document.documentElement.classList;
      c.remove(dark ? 'light-theme' : 'dark-theme');
      c.toggle('dark-mode', dark); // tool pages key their dark styles on .dark-mode
      c.add(dark ? 'dark-theme' : 'light-theme');
    })();
  </script>

  <style>

      background: radial-gradient(60% 50% at 50% 42%, #ffffff 0%, var(--zs-bg) 70%); }

    .zs-aura { position: absolute; inset: -38px; border-radius: 50%; filter: blur(34px); opacity: .55;

    .o1 .zs-dot.b { color: #22c55e; top: auto; bottom: -4px; }

              mask-image: radial-gradient(circle at 50% 46%, transparent var(--zs-hole), #000 calc(var(--zs-hole) + 2px));
      animation: zs-iris .9s cubic-bezier(.7,0,.2,1) .15s forwards, zs-fade-out .35s ease .85s forwards; }
    #zs-splash.zs-out .zs-stage { animation: zs-lift .6s cubic-bezier(.6,0,.4,1) forwards; }

    @keyframes zs-spin-rev { to { transform: rotate(-360deg); } }

       This file is the SPA shell Vercel serves for EVERY unmatched route (see the
       catch-all rewrite in vercel.json), so a hardcoded homepage canonical was

       article duplicated the homepage, which guaranteed none of them were indexed.
       SeoService.updateMetaTags() injects the correct per-route value: baked in at
       prerender time for static routes, set on hydration for dynamic ones.
       Do not reintroduce a hardcoded canonical here. -->
