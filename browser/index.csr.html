  <!-- Apply the saved theme BEFORE first paint. ThemeService only adds .dark-theme once
       Angular boots, so without this the :root (light) palette - a cyan --bg-primary
       gradient - flashed on every load, most visibly on mobile. Dark is the default. -->
  <script>
    (function () {
      var dark = true;
      try { dark = localStorage.getItem('theme') !== 'light'; } catch (e) {}
      document.documentElement.classList.add(dark ? 'dark-theme' : 'light-theme');
      if (dark) document.documentElement.classList.add('dark-mode'); // tool pages key their dark styles on .dark-mode
    })();
  </script>
  <style>
    html.dark-theme, html.dark-theme body { background-color: #000; }
  </style>

  <style>
    @property --zs-hole { syntax: '<length>'; inherits: false; initial-value: 0px; }
    html.zs-loading, html.zs-loading body { overflow: hidden; }
    #zs-splash {
      --zs-bg: #030406; --zs-ink: #f8fafc; --zs-sub: #94a3b8; --zs-track: rgba(255,255,255,.08);
      position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center;
      background: radial-gradient(60% 50% at 50% 42%, #0b1220 0%, var(--zs-bg) 70%);
      color: var(--zs-ink); font-family: 'Dosis', system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden; contain: strict;
    }
    html.light-theme #zs-splash { --zs-bg: #f8fafc; --zs-ink: #0f172a; --zs-sub: #475569; --zs-track: rgba(15,23,42,.08);
      background: radial-gradient(60% 50% at 50% 42%, #ffffff 0%, var(--zs-bg) 70%); }
    /* faint grid matching the site background */
    #zs-splash::before { content: ''; position: absolute; inset: -2px; opacity: .35;
      background-image: linear-gradient(var(--zs-track) 1px, transparent 1px), linear-gradient(90deg, var(--zs-track) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 65%);
              mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 65%); }
    .zs-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .zs-emblem { position: relative; width: 210px; height: 210px; display: grid; place-items: center; }
    /* rotating aura in the logo's own colours: red, orange, green, blue */
    .zs-aura { position: absolute; inset: -38px; border-radius: 50%; filter: blur(34px); opacity: .55;
      background: conic-gradient(from 0deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #ef4444);
      animation: zs-spin 6s linear infinite, zs-breathe 2.4s ease-in-out infinite; }
    html.light-theme .zs-aura { opacity: .28; }
    .zs-rings { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .zs-ring { fill: none; stroke-linecap: round; transform-origin: 105px 105px; }
    .zs-ring.r1 { stroke: url(#zsGrad); stroke-width: 2.2; stroke-dasharray: 520; stroke-dashoffset: 520;
      animation: zs-draw 1.4s cubic-bezier(.65,0,.35,1) .15s forwards, zs-spin 7s linear 1.5s infinite; }
    .zs-ring.r2 { stroke: url(#zsGrad); stroke-width: 1.2; opacity: .55; stroke-dasharray: 6 10;
      animation: zs-spin-rev 14s linear infinite; }
    .zs-orbit { position: absolute; inset: 0; animation: zs-spin 3.2s linear infinite; }
    .zs-orbit.o2 { inset: 16px; animation-duration: 4.6s; animation-direction: reverse; }
    .zs-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; top: -4px; left: calc(50% - 4px);
      background: currentColor; box-shadow: 0 0 14px 3px currentColor; }
    .o1 .zs-dot.a { color: #ef4444; }
    .o1 .zs-dot.b { color: #22c55e; top: auto; bottom: -4px; }
    .o2 .zs-dot.a { color: #f59e0b; width: 7px; height: 7px; }
    .o2 .zs-dot.b { color: #3b82f6; width: 7px; height: 7px; top: auto; bottom: -3px; }
    .zs-logo { position: relative; width: 132px; height: 132px; object-fit: contain;
      filter: drop-shadow(0 10px 30px rgba(59,130,246,.35));
      opacity: 0; transform: scale(.55) rotate(-14deg);
      animation: zs-pop 1s cubic-bezier(.2,1.4,.35,1) .1s forwards, zs-float 3.2s ease-in-out 1.2s infinite; }
    .zs-word { display: flex; font-size: 44px; font-weight: 800; letter-spacing: .02em; line-height: 1.1; perspective: 400px; }
    .zs-word span { display: inline-block; opacity: 0; transform: translateY(26px) rotateX(70deg); filter: blur(6px);
      background: linear-gradient(100deg, var(--zs-ink) 0%, var(--zs-ink) 40%, #60a5fa 50%, var(--zs-ink) 60%, var(--zs-ink) 100%);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: zs-rise .7s cubic-bezier(.2,.9,.3,1) forwards, zs-shine 2.6s linear infinite; }
    .zs-tag { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--zs-sub);
      opacity: 0; animation: zs-fade .8s ease 1.05s forwards; }
    .zs-bar { width: 220px; height: 3px; border-radius: 3px; background: var(--zs-track); overflow: hidden;
      opacity: 0; animation: zs-fade .5s ease .6s forwards; }
    .zs-bar i { display: block; height: 100%; width: var(--zs-p, 8%); border-radius: inherit;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #ef4444); background-size: 200% 100%;
      transition: width .45s cubic-bezier(.3,.8,.3,1); animation: zs-flow 1.6s linear infinite; }
    /* exit: the emblem lifts away while an iris opens from the centre to reveal the page */
    #zs-splash.zs-out { pointer-events: none;
      -webkit-mask-image: radial-gradient(circle at 50% 46%, transparent var(--zs-hole), #000 calc(var(--zs-hole) + 2px));
              mask-image: radial-gradient(circle at 50% 46%, transparent var(--zs-hole), #000 calc(var(--zs-hole) + 2px));
      animation: zs-iris .9s cubic-bezier(.7,0,.2,1) .15s forwards, zs-fade-out .35s ease .85s forwards; }
    #zs-splash.zs-out .zs-stage { animation: zs-lift .6s cubic-bezier(.6,0,.4,1) forwards; }
    @keyframes zs-spin { to { transform: rotate(360deg); } }
    @keyframes zs-spin-rev { to { transform: rotate(-360deg); } }
    @keyframes zs-breathe { 0%, 100% { scale: .92; } 50% { scale: 1.06; } }
    @keyframes zs-draw { to { stroke-dashoffset: 0; } }
    @keyframes zs-pop { to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes zs-float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -7px; } }
    @keyframes zs-rise { to { opacity: 1; transform: none; filter: none; } }
    @keyframes zs-shine { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    @keyframes zs-fade { to { opacity: 1; } }
    @keyframes zs-fade-out { to { opacity: 0; } }
    @keyframes zs-flow { to { background-position: -200% 0; } }
    @keyframes zs-iris { to { --zs-hole: 150vmax; } }
    @keyframes zs-lift { to { opacity: 0; transform: scale(1.18) translateY(-12px); filter: blur(6px); } }
    @media (max-width: 480px) {
      .zs-emblem { width: 170px; height: 170px; }

    }

  <!-- No static canonical link is declared here, deliberately.
       This file is the SPA shell Vercel serves for EVERY unmatched route (see the
       catch-all rewrite in vercel.json), so a hardcoded homepage canonical was
       being served on every dynamically-routed news article - telling Google each
       article duplicated the homepage, which guaranteed none of them were indexed.
       SeoService.updateMetaTags() injects the correct per-route value: baked in at
       prerender time for static routes, set on hydration for dynamic ones.
       Do not reintroduce a hardcoded canonical here. -->
